name: CI — SalaryScope ML

on:
  push:
    paths: ["03-salaryscope-ml/**"]
  pull_request:
    paths: ["03-salaryscope-ml/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: 03-salaryscope-ml

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        # Tests sur données synthétiques + modèles servis commités (pas besoin du GOLD).
        run: pytest -q
